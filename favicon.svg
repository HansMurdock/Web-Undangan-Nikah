<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae3a6"/>
      <stop offset="35%" stop-color="#d49b45"/>
      <stop offset="70%" stop-color="#c86820"/>
      <stop offset="100%" stop-color="#f5d697"/>
    </linearGradient>
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe6b3"/>
      <stop offset="45%" stop-color="#d49b45"/>
      <stop offset="100%" stop-color="#ab4d13"/>
    </linearGradient>
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff0cc"/>
      <stop offset="50%" stop-color="#e0a852"/>
      <stop offset="100%" stop-color="#9a430d"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#c86820" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Badge -->
  <circle cx="32" cy="32" r="30" fill="#14110e" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#d49b45" stroke-width="0.6" stroke-opacity="0.4"/>

  <!-- Interlocking Twin Wedding Rings with Glow -->
  <g filter="url(#goldGlow)">
    <!-- Left Ring -->
    <circle cx="25.5" cy="34" r="11" fill="none" stroke="url(#ringGrad1)" stroke-width="3.2"/>
    <!-- Right Ring -->
    <circle cx="38.5" cy="34" r="11" fill="none" stroke="url(#ringGrad2)" stroke-width="3.2"/>

    <!-- Left Ring Overlap Arc (creates true 3D interlock) -->
    <path d="M 33 25 A 11 11 0 0 1 36.5 35" fill="none" stroke="url(#ringGrad1)" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Solitaire Diamond on Top of Left Ring -->
    <polygon points="25.5,17 28.2,22.5 25.5,25.5 22.8,22.5" fill="#ffffff" stroke="#fae3a6" stroke-width="0.5"/>
    <!-- Diamond Glint Stars -->
    <line x1="21.5" y1="22.5" x2="29.5" y2="22.5" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="25.5" y1="18.5" x2="25.5" y2="26.5" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round"/>
  </g>
</svg>